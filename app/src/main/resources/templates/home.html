<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: pagehead('ホーム')}"></head>
<body>
<div class="page">
  <div th:replace="~{fragments/nav :: header}"></div>

  <div class="hero">
    <p>今日はどんなカフェに<br>行きたいですか？</p>
    <a class="search-pill" th:href="@{/map}">🔍 カフェを検索する</a>
  </div>

  <div class="cat-grid">
    <a class="cat-item" th:href="@{/map}"><span class="ic">📍</span>近くのカフェ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">⭐</span>人気のカフェ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">✨</span>おすすめ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">🗺</span>カフェ巡り</a>
  </div>

  <div class="section-title">近くのカフェ</div>
  <div class="hcard-row">
    <a class="hcard" th:each="c,it : ${cafes}" th:href="@{'/cafes/' + ${c.id}}">
      <div class="photo" th:if="${c.photoUrl}"><img th:src="${c.photoUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;"></div>
      <div class="photo" th:unless="${c.photoUrl}">
        <img th:src="${it.index % 2 == 0} ? '/images/nearby-1.jpg' : '/images/nearby-2.jpg'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">
      </div>
      <div class="info">
        <div class="name" th:text="${c.name}">カフェ名</div>
        <div class="meta">
          <span th:if="${c.rating}"><span class="stars">★</span> <span th:text="${#numbers.formatDecimal(c.rating,1,1)}">4.5</span></span>
        </div>
      </div>
    </a>
    <p th:if="${#lists.isEmpty(cafes)}" style="padding:0 18px; font-size:12px; color:var(--ink-soft);">
      カフェが登録されていません。
    </p>
  </div>

  <div class="section-title" th:if="${!#lists.isEmpty(favorites)}">お気に入り</div>
  <div class="hcard-row" th:if="${!#lists.isEmpty(favorites)}">
    <a class="hcard" th:each="c,it : ${favorites}" th:href="@{'/cafes/' + ${c.id}}">
      <div class="photo" th:if="${c.photoUrl}"><img th:src="${c.photoUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;"></div>
      <div class="photo" th:unless="${c.photoUrl}">
        <img th:src="${it.index % 2 == 0} ? '/images/nearby-1.jpg' : '/images/nearby-2.jpg'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">
      </div>
      <div class="info">
        <div class="name" th:text="${c.name}">カフェ名</div>
        <div class="meta">
          <span th:if="${c.rating}"><span class="stars">★</span> <span th:text="${#numbers.formatDecimal(c.rating,1,1)}">4.5</span></span>
        </div>
      </div>
    </a>
  </div>

  <div th:replace="~{fragments/nav :: bottomnav('home')}"></div>
</div>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    if (params.get("lat") === null && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        params.set("lat", pos.coords.latitude);
        params.set("lng", pos.coords.longitude);
        location.search = params.toString();
      }, function () { /* 拒否された場合は何もしない */ });
    }
  })();
</script>
</body>
</html>
