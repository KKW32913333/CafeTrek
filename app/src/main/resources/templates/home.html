<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: pagehead('ホーム')}"></head>
<body>
<div class="page">
  <div th:replace="~{fragments/nav :: header}"></div>

  <div class="hero">
    <p>今日はどんなカフェに<br>行きたいですか？</p>
    <a class="search-pill" th:href="@{/map}">🔍 カフェを検索する</a>
  </div>

  <div class="cat-grid">
    <a class="cat-item" th:href="@{/map}"><span class="ic">📍</span>近くのカフェ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">⭐</span>人気のカフェ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">✨</span>おすすめ</a>
    <a class="cat-item" th:href="@{/map}"><span class="ic">🗺</span>カフェ巡り</a>
  </div>

  <div class="section-title">近くのカフェ</div>
  <div class="hcard-row">
    <a class="hcard" th:each="c : ${cafes}" th:href="@{'/cafes/' + ${c.id}}">
      <div class="photo">☕</div>
      <div class="info">
        <div class="name" th:text="${c.name}">カフェ名</div>
        <div class="meta">
          <span th:if="${c.rating}"><span class="stars">★</span> <span th:text="${#numbers.formatDecimal(c.rating,1,1)}">4.5</span></span>
        </div>
      </div>
    </a>
    <p th:if="${#lists.isEmpty(cafes)}" style="padding:0 18px; font-size:12px; color:var(--ink-soft);">
      カフェが登録されていません。
    </p>
  </div>

  <div class="section-title">あなたへのおすすめ</div>
  <a class="card" style="display:flex; gap:12px; margin:0 18px 20px; padding:10px;"
     th:if="${!#lists.isEmpty(cafes)}" th:href="@{'/cafes/' + ${cafes[0].id}}">
    <div class="photo" style="width:88px; height:88px; border-radius:12px; flex:0 0 88px;">☕</div>
    <div>
      <div style="font-size:13px; font-weight:700;" th:text="${cafes[0].name}">カフェ名</div>
      <div style="font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:4px;">
        浅煎り・フルーティーなコーヒーが人気のお店です。
      </div>
      <div style="font-size:11px; color:var(--green-deep); font-weight:700; margin-top:6px;">詳細を見る ›</div>
    </div>
  </a>

  <div th:replace="~{fragments/nav :: bottomnav('home')}"></div>
</div>
</body>
</html>
