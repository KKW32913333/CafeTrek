<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: pagehead('地図')}"></head>
<body>
<div class="page">
  <div th:replace="~{fragments/nav :: header}"></div>

  <div class="map-search">🔍 このエリアで検索</div>
  <div class="chip-row" style="margin-top:10px;">
    <div class="chip active">すべて</div>
    <div class="chip">カフェ</div>
    <div class="chip">スイーツ</div>
    <div class="chip">作業向き</div>
  </div>

  <div id="gmap" style="margin:12px 18px; height:220px; border-radius:16px; border:1px solid var(--line);"></div>

  <div class="list-header">
    <span>周辺のカフェ</span>
    <span style="font-weight:400; color:var(--ink-soft); font-size:11.5px;" th:text="${#lists.size(cafes)} + '件'">0件</span>
  </div>
  <div class="list">
    <a class="row" th:each="c : ${cafes}" th:href="@{'/cafes/' + ${c.id}}">
      <div class="photo">☕</div>
      <div class="info">
        <div class="name" th:text="${c.name}">カフェ名</div>
        <div class="meta" th:if="${c.rating}"><span class="stars">★</span> <span th:text="${#numbers.formatDecimal(c.rating,1,1)}">4.5</span></div>
      </div>
      <span style="color:var(--heart); font-size:16px;" th:text="${c.favorite} ? '♥' : '♡'">♡</span>
    </a>
  </div>

  <div th:replace="~{fragments/nav :: bottomnav('map')}"></div>
</div>

<script th:inline="javascript">
  var cafeMarkers = [
    /*[# th:each="c : ${cafes}"]*/
    { id: /*[[${c.id}]]*/ 0, name: /*[[${c.name}]]*/ '', lat: /*[[${c.latitude}]]*/ null, lng: /*[[${c.longitude}]]*/ null },
    /*[/]*/
  ];

  function initMap() {
    var withCoords = cafeMarkers.filter(function (c) { return c.lat && c.lng; });
    var center = withCoords.length > 0
      ? { lat: withCoords[0].lat, lng: withCoords[0].lng }
      : { lat: 33.5902, lng: 130.4017 }; // 福岡駅（カフェが1件も座標を持たない場合のフォールバック）

    var map = new google.maps.Map(document.getElementById("gmap"), {
      center: center,
      zoom: 14,
    });

    withCoords.forEach(function (c) {
      var marker = new google.maps.Marker({
        position: { lat: c.lat, lng: c.lng },
        map: map,
        title: c.name,
      });
      marker.addListener("click", function () {
        window.location.href = "/cafes/" + c.id;
      });
    });
  }
</script>
<script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&callback=initMap'" async defer></script>
</body>
</html>
